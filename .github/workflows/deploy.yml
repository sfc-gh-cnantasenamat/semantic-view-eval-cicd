name: Deploy and evaluate Cortex project

on:
  push:
    branches:
      - main
    paths:
      - 'cortex_project/**'
      - 'scripts/**'
      - 'evals/**'
      - 'sql/**'
      - '.github/workflows/deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'cortex_project/**'
      - 'scripts/**'
      - 'evals/**'
      - 'sql/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token generation
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Validate manifest artifacts
        run: python3 scripts/validate.py

  deploy_candidate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      WAREHOUSE: COMPUTE_WH
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Install and configure Snowflake CLI
        uses: snowflakedb/snowflake-actions@v2.0.4
        with:
          use-oidc: true
          cli-version: "3.24"
          default-config-file-path: ".snowflake/config.toml"

      - name: Deploy semantic view and candidate agent version
        env:
          SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_USER: SV_EVAL_CICD_USER
          SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: WORKLOAD_IDENTITY
        run: bash scripts/deploy.sh

  eval_sv:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: deploy_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAREHOUSE: COMPUTE_WH
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Install and configure Snowflake CLI
        uses: snowflakedb/snowflake-actions@v2.0.4
        with:
          use-oidc: true
          cli-version: "3.24"
          default-config-file-path: ".snowflake/config.toml"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Evaluate semantic view SQL correctness
        env:
          SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_USER: SV_EVAL_CICD_USER
          SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: WORKLOAD_IDENTITY
        run: bash scripts/eval_sv.sh

  eval:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: eval_sv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAREHOUSE: COMPUTE_WH
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Install and configure Snowflake CLI
        uses: snowflakedb/snowflake-actions@v2.0.4
        with:
          use-oidc: true
          cli-version: "3.24"
          default-config-file-path: ".snowflake/config.toml"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Run native agent evaluation
        env:
          SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_USER: SV_EVAL_CICD_USER
          SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: WORKLOAD_IDENTITY
        run: bash scripts/eval.sh

  promote:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: eval
    runs-on: ubuntu-latest
    env:
      WAREHOUSE: COMPUTE_WH
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Install and configure Snowflake CLI
        uses: snowflakedb/snowflake-actions@v2.0.4
        with:
          use-oidc: true
          cli-version: "3.24"
          default-config-file-path: ".snowflake/config.toml"

      - name: Promote last version to production
        env:
          SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_USER: SV_EVAL_CICD_USER
          SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: WORKLOAD_IDENTITY
        run: bash scripts/promote.sh
